  standard_id: nasdaq-5550b1-c
  standard_name: "Equity Standard"
  metric: {kind: concept, concept: stockholders_equity}
  window: {kind: instant}
  comparison: gte
  threshold: 2500000
  threshold_unit: usd
  effective_from: 2009-04-13
  citation:
    rule_section: "Rule 5550(b)(1)"
    rule_url: https://listingcenter.nasdaq.com/rulebook/nasdaq/rules/nasdaq-5500-series
    quoted_text: "Stockholders' equity of at least $2.5 million"
