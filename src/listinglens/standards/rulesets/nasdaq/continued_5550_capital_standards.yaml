# Nasdaq continued listing, Rule 5550. Stable text from SR-NASDAQ-2009-018 (operative
# 2009-04-13), read from the Nasdaq rulebook on 2026-10-13 and verified by the architect.
# Capital Market. Tier-common conditions in 5550(a); one financial standard in 5550(b).

# The two_of_three_fiscal_years branch needs the multi-year series that extraction does not
# produce yet, so chunk 14 reports it not evaluable; the latest_fiscal_year branch is
# evaluable from the latest annual figure (D36).

