  # Only the 450 count is a rule here; clause (ii), that at least 50% of them each hold
  # Unrestricted Securities worth $2,500 or more, is in the quoted text and is not
  # modeled separately. Chunk 14 flags it (D38).
- rule_id: nasdaq-5315f1-gs-round-lot-holders
  exchange: nasdaq
  tier: global_select
  listing_type: initial
  pathways: [traditional_ipo]
  requirement: nasdaq-5315f1-gs-ownership
  branch: round_lot_holders_450
  metric: {kind: external, input: round_lot_holders}
  window: {kind: instant}
  comparison: gte
  threshold: 450
  threshold_unit: count
  effective_from: 2009-04-13
  citation:
    rule_section: "Rule 5315(f)(1)"
    rule_url: https://listingcenter.nasdaq.com/rulebook/nasdaq/rules/nasdaq-5300-series
    quoted_text: "(i) A minimum of 450 Round Lot Holders; and (ii) at least 50% of such Round Lot Holders must each hold Unrestricted Securities with a Market Value of at least $2,500"
    retrieved_on: 2026-10-20
    sec_release: SR-NASDAQ-2009-018
    sec_release_url: https://www.sec.gov/rule-release/34-59663
  verification: {verified: true, verified_on: 2026-10-20, verified_by: Austin Smith}
