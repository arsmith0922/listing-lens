# Nasdaq initial listing, Rule 5505, IPO circumstance only (pathway traditional_ipo).
# Read from the Nasdaq rulebook on 2026-10-20 and verified by the architect (D37).
# Equity Standard 5505(b)(1) and Market Value of Listed Securities Standard 5505(b)(2).
# MVUPHS records carry the 2025 amendment value only; an as_of before their effective date
# yields the standard without that condition until the eval-phase backfill (D37).

