# Nasdaq continued listing, Rule 5450. Stable text from SR-NASDAQ-2009-018 (operative
# 2009-04-13), read from the Nasdaq rulebook on 2026-10-13 and verified by the architect (the stayed
# floor below excepted).
# Rule 5305(e) puts Global Select Market companies under the Rule 5400 Series, so this copy for tier global_select is identical to the other 5450 copy except tier and ids (D36).

  # How long the bid must stay below $1 is not encoded; chunk 14 flags that and reports this
  # rule not evaluable (external market_price).
- rule_id: nasdaq-5450-gs-bid-price
  exchange: nasdaq
  tier: global_select
  listing_type: continued
  pathways: [traditional_ipo, spac_ipo, de_spac, reverse_merger, direct_listing]
  metric: {kind: external, input: market_price}
  window: {kind: instant}
  comparison: gte
  threshold: 1
  threshold_unit: usd_per_share
  effective_from: 2009-04-13
  citation:
    rule_section: "Rule 5450(a)"
    rule_url: https://listingcenter.nasdaq.com/rulebook/nasdaq/rules/nasdaq-5400-series
    quoted_text: "Minimum bid price of $1 per share"
    retrieved_on: 2026-10-13
    sec_release: SR-NASDAQ-2009-018
    sec_release_url: https://www.sec.gov/rule-release/34-59663
  verification: {verified: true, verified_on: 2026-10-13, verified_by: Austin Smith}

- rule_id: nasdaq-5450-gs-total-holders
  exchange: nasdaq
  tier: global_select
  listing_type: continued
  pathways: [traditional_ipo, spac_ipo, de_spac, reverse_merger, direct_listing]
  metric: {kind: external, input: total_holders}
  window: {kind: instant}
  comparison: gte
  threshold: 400
  threshold_unit: count
  effective_from: 2009-04-13
  citation:
    rule_section: "Rule 5450(a)"
    rule_url: https://listingcenter.nasdaq.com/rulebook/nasdaq/rules/nasdaq-5400-series
    quoted_text: "At least 400 Total Holders"
    retrieved_on: 2026-10-13
    sec_release: SR-NASDAQ-2009-018
    sec_release_url: https://www.sec.gov/rule-release/34-59663
  verification: {verified: true, verified_on: 2026-10-13, verified_by: Austin Smith}

  # Stayed: added by SR-NASDAQ-2026-004, whose approval order the SEC stayed. No
  # effective_from and unverified, so it is never in force (D36).
- rule_id: nasdaq-5450-gs-mvls-floor-stayed
  exchange: nasdaq
  tier: global_select
  listing_type: continued
  pathways: [traditional_ipo, spac_ipo, de_spac, reverse_merger, direct_listing]
  metric: {kind: derived, quantity: market_value_of_listed_securities}
  window: {kind: instant}
  comparison: gte
  threshold: 5000000
  threshold_unit: usd
  effective_from: ~
  citation:
    rule_section: "Rule 5450(a)(3)"
    rule_url: https://listingcenter.nasdaq.com/rulebook/nasdaq/rules/nasdaq-5400-series
    quoted_text: "Market Value of Listed Securities of at least $5 million [Not in effect: the SEC stayed the approval order for SR-NASDAQ-2026-004.]"
    retrieved_on: 2026-10-13
    sec_release: SR-NASDAQ-2026-004
    sec_release_url: https://listingcenter.nasdaq.com/assets/RuleBook/Nasdaq/rules/SR-NASDAQ-2026-004_letter-deputy-secretary-regarding-sr-nasdaq-2026-004.pdf
  verification: {verified: false}
