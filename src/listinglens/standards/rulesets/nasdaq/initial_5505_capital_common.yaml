# Nasdaq initial listing, Rule 5505, IPO circumstance only (pathway traditional_ipo).
# Read from the Nasdaq rulebook on 2026-10-20 and verified by the architect (D37).
# Tier-common conditions of 5505(a); one financial standard of 5505(b) is also needed.
# MVUPHS records carry the 2025 amendment value only; an as_of before their effective date
# yields the standard without that condition until the eval-phase backfill (D37).

# Rule 5505(b)(4), the acquisition-company standard, is not encoded: the supplied content
# gives no figures for it and it belongs with the spac_ipo pathway (Phase 7).

- rule_id: nasdaq-5505-c-bid-price
  exchange: nasdaq
  tier: capital
  listing_type: initial
  pathways: [traditional_ipo]
  requirement: nasdaq-5505-c-bid-price-period
  branch: bid_4
  metric: {kind: external, input: market_price}
  window: {kind: instant}
  comparison: gte
  threshold: 4
  threshold_unit: usd_per_share
  effective_from: 2009-04-13
  citation:
    rule_section: "Rule 5505(a)(1)(A)"
    rule_url: https://listingcenter.nasdaq.com/rulebook/nasdaq/rules/nasdaq-5500-series
    quoted_text: "Minimum bid price of $4 per share"
    retrieved_on: 2026-10-20
    sec_release: SR-NASDAQ-2009-018
    sec_release_url: https://www.sec.gov/rule-release/34-59663
  verification: {verified: true, verified_on: 2026-10-20, verified_by: Austin Smith}

  # Not evaluable, and a flagged stand-in, not a model of the rule: the quoted text is the
  # rule. The closing price ($3 or $2, which depends on the standard met), the $5 million
  # figure for an issuer in operation under three years, and the average revenue of at
  # least $6 million alternative are in the text and are not modeled. Only the $2 million
  # net tangible assets figure is a threshold here (in excess of, so gt); chunk 14
  # treats the whole branch as not evaluable (D37).
- rule_id: nasdaq-5505-c-lower-bid-nta
  exchange: nasdaq
  tier: capital
  listing_type: initial
  pathways: [traditional_ipo]
  requirement: nasdaq-5505-c-bid-price-period
  branch: lower_bid_alternative
  metric: {kind: external, input: net_tangible_assets}
  window: {kind: instant}
  comparison: gt
  threshold: 2000000
  threshold_unit: usd
  effective_from: 2009-04-13
  citation:
    rule_section: "Rule 5505(a)(1)(B)"
    rule_url: https://listingcenter.nasdaq.com/rulebook/nasdaq/rules/nasdaq-5500-series
    quoted_text: "Minimum closing price of $3 per share, if the Company meets the requirements of the Equity or Net Income Standards under Rules 5505(b)(1) or (b)(3), or of $2 per share, if the Company meets the requirements of the Market Value of Listed Securities Standard under Rule 5505(b)(2), provided that in either case the Company must also demonstrate that it has net tangible assets (i.e., total assets less intangible assets and liabilities) in excess of $2 million, if the issuer has been in continuous operation for at least three years; or net tangible assets in excess of $5 million, if the issuer has been in continuous operation for less than three years; or average revenue of at least $6 million for the last three years"
    retrieved_on: 2026-10-20
    sec_release: SR-NASDAQ-2009-018
    sec_release_url: https://www.sec.gov/rule-release/34-59663
  verification: {verified: true, verified_on: 2026-10-20, verified_by: Austin Smith}

- rule_id: nasdaq-5505-c-uphs
  exchange: nasdaq
  tier: capital
  listing_type: initial
  pathways: [traditional_ipo]
  metric: {kind: external, input: unrestricted_publicly_held_shares}
  window: {kind: instant}
  comparison: gte
  threshold: 1000000
  threshold_unit: shares
  effective_from: 2009-04-13
  citation:
    rule_section: "Rule 5505(a)(2)"
    rule_url: https://listingcenter.nasdaq.com/rulebook/nasdaq/rules/nasdaq-5500-series
    quoted_text: "At least 1,000,000 Unrestricted Publicly Held Shares"
    retrieved_on: 2026-10-20
    sec_release: SR-NASDAQ-2009-018
    sec_release_url: https://www.sec.gov/rule-release/34-59663
  verification: {verified: true, verified_on: 2026-10-20, verified_by: Austin Smith}

  # Only the 300 count is a rule here; clause (ii), that at least 50% of them each hold
  # Unrestricted Securities worth $2,500 or more, is in the quoted text and is not
  # modeled separately. Chunk 14 flags it (D37).
- rule_id: nasdaq-5505-c-round-lot-holders
  exchange: nasdaq
  tier: capital
  listing_type: initial
  pathways: [traditional_ipo]
  metric: {kind: external, input: round_lot_holders}
  window: {kind: instant}
  comparison: gte
  threshold: 300
  threshold_unit: count
  effective_from: 2009-04-13
  citation:
    rule_section: "Rule 5505(a)(3)"
    rule_url: https://listingcenter.nasdaq.com/rulebook/nasdaq/rules/nasdaq-5500-series
    quoted_text: "(i) At least 300 Round Lot Holders; and (ii) at least 50% of such Round Lot Holders must each hold Unrestricted Securities with a Market Value of at least $2,500"
    retrieved_on: 2026-10-20
    sec_release: SR-NASDAQ-2009-018
    sec_release_url: https://www.sec.gov/rule-release/34-59663
  verification: {verified: true, verified_on: 2026-10-20, verified_by: Austin Smith}

