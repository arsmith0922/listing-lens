# Nasdaq continued listing, Rule 5450. Stable text from SR-NASDAQ-2009-018 (operative
# 2009-04-13), read from the Nasdaq rulebook on 2026-10-13 and verified by the architect.
# Rule 5305(e) puts Global Select Market companies under the Rule 5400 Series, so this copy for tier global_select is identical to the other 5450 copy except tier and ids (D36).

# Branches are independent years today. The rule means the same two of three years for
# assets and revenue; same-year pairing is added when the multi-year series makes the
# two_of_three_fiscal_years branch evaluable (D36).

- rule_id: nasdaq-5450b3-gs-assets-latest
  exchange: nasdaq
  tier: global_select
  listing_type: continued
  pathways: [traditional_ipo, spac_ipo, de_spac, reverse_merger, direct_listing]
  standard_id: nasdaq-5450b3-gs
  standard_name: "Total Assets/Total Revenue Standard"
  requirement: nasdaq-5450b3-gs-assets-revenue-period
  branch: latest_fiscal_year
  metric: {kind: concept, concept: total_assets}
  window: {kind: latest_fiscal_year}
  comparison: gte
  threshold: 50000000
  threshold_unit: usd
  effective_from: 2009-04-13
  citation:
    rule_section: "Rule 5450(b)(3)"
    rule_url: https://listingcenter.nasdaq.com/rulebook/nasdaq/rules/nasdaq-5400-series
    quoted_text: "Total assets and total revenue of at least $50 million each for the most recently completed fiscal year or two of the three most recently completed fiscal years"
    retrieved_on: 2026-10-13
    sec_release: SR-NASDAQ-2009-018
    sec_release_url: https://www.sec.gov/rule-release/34-59663
  verification: {verified: true, verified_on: 2026-10-13, verified_by: Austin Smith}

