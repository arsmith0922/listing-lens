# Nasdaq initial listing, Rule 5405, IPO circumstance only (pathway traditional_ipo).
# Read from the Nasdaq rulebook on 2026-10-20 and verified by the architect (D37).
# Income Standard 5405(b)(1) and Equity Standard 5405(b)(2).
# MVUPHS records carry the 2025 amendment value only; an as_of before their effective date
# yields the standard without that condition until the eval-phase backfill (D37).

- rule_id: nasdaq-5405b1-g-pretax-latest
  exchange: nasdaq
  tier: global
  listing_type: initial
  pathways: [traditional_ipo]
  standard_id: nasdaq-5405b1-g
  standard_name: "Income Standard"
  requirement: nasdaq-5405b1-g-income-period
  branch: latest_fiscal_year
  metric: {kind: concept, concept: pretax_income}
  window: {kind: latest_fiscal_year}
  comparison: gte
  threshold: 1000000
  threshold_unit: usd
  effective_from: 2009-04-13
  citation:
    rule_section: "Rule 5405(b)(1)"
    rule_url: https://listingcenter.nasdaq.com/rulebook/nasdaq/rules/nasdaq-5400-series
    quoted_text: "Annual income from continuing operations before income taxes of at least $1,000,000 in the most recently completed fiscal year or in two of the three most recently completed fiscal years"
    retrieved_on: 2026-10-20
    sec_release: SR-NASDAQ-2009-018
    sec_release_url: https://www.sec.gov/rule-release/34-59663
  verification: {verified: true, verified_on: 2026-10-20, verified_by: Austin Smith}

